  #     - redis
  #     - postgres
  #     - mongodb

  # web-client:  # Placeholder - закомментировано
  #   image: web-client-image
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - core-service
  #     - auth-service

