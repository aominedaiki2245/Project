services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
      # - auth-service  # Закомментировано для теста
      # - core-service
    ports:
      - "8080:8080"  # Если webhook; для polling не нужно
    volumes:
      - .:/app

  # nginx-bot:  # Закомментировано, если не нужен
  #   image: nginx:latest
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx-bot.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - bot

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

